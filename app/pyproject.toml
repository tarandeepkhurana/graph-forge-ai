[project]
name = "graphforge"
version = "0.1.0"
description = "Editable, grounded knowledge graphs from uploaded artifacts"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",   # multipart form uploads
    "itsdangerous>=2.2",
    # data stores
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "neo4j>=5.27",
    # security
    "argon2-cffi>=23.1",
    "pydantic-settings>=2.7",
    "pydantic[email]>=2.9",   # EmailStr validation on signup
    # ingestion
    "pymupdf>=1.25",
    "python-docx>=1.1",
    "httpx>=0.28",
    # ai
    "openai>=1.60",
    # extraction model (CPU)
    "torch>=2.6",
    "transformers>=4.48",
    "gliner>=0.2.13",
    "sentencepiece>=0.2",
    "rapidfuzz>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "pip-audit>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphforge"]

# CPU-only torch: there is no NVIDIA GPU on the target machine, and the default
# PyPI wheel can pull a multi-GB CUDA runtime we cannot use.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
